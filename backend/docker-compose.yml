services:
  postgres:
    image: postgres:16-alpine
    container_name: norax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: norax
    ports:
      - "5432:5432"
    volumes:
      - norax_pg_data:/var/lib/postgresql/data

volumes:
  norax_pg_data:
