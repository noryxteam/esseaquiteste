services:
  postgres:
    image: postgres:16-alpine
    container_name: norax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: norax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: norax
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - norax_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norax -d norax"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  norax_pg_data:
